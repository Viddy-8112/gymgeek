<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% feed_meta %}
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/gymgeek.css' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/favicon/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EMS5WHW7F7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-EMS5WHW7F7');
  </script>
</head>

<body data-layout="{{ page.layout }}">
<div id="progress-bar"></div>
<nav class="site-nav">
  <a href="{{ '/' | relative_url }}" class="site-logo">GymGeek</a>
  <div class="nav-links">
    <a href="{{ '/workouts/' | relative_url }}">Training</a>
    <a href="{{ '/nutrition/' | relative_url }}">Nutrition</a>
    <a href="{{ '/gear/' | relative_url }}">Gear</a>
    <a href="{{ '/tools/' | relative_url }}">Tools</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </div>
  <div class="nav-search">
    <div class="search-toggle" onclick="toggleSearch()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <div class="search-box" id="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="Search articles...">
      <div id="results-container" class="search-results"></div>
    </div>
  </div>
</nav>


  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ 'now' | date: "%Y" }} GymGeek. Built in South Africa.</span>
    <span>Affiliate disclosure</span>
  </footer>

 <script src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>
  <script>
    function toggleSearch() {
      const box = document.getElementById('search-box');
      box.classList.toggle('open');
      if (box.classList.contains('open')) {
        document.getElementById('search-input').focus();
      }
    }

    document.addEventListener('click', function(e) {
      const nav = document.querySelector('.nav-search');
      if (nav && !nav.contains(e.target)) {
        document.getElementById('search-box').classList.remove('open');
      }
    });

    window.addEventListener('load', function() {
      SimpleJekyllSearch({
        searchInput: document.getElementById('search-input'),
        resultsContainer: document.getElementById('results-container'),
        json: '/search.json',
        searchResultTemplate: `
          <a href="{url}">
            <div class="card-tag">{category}</div>
            <div class="card-title">{title}</div>
          </a>
        `,
        noResultsText: '<div class="search-no-results">No articles found.</div>'
      });
    });
  </script>

  <script>
    window.addEventListener('load', function() {
      const el = document.querySelector('.hero-headline');
      if (!el) return;

      // Only run on homepage
      if (window.location.pathname !== '/' && window.location.pathname !== '/index.html') return;

      const lines = ['Train', 'harder.', 'Know more.'];
      const colors = [null, '#E85D26', null];
      el.innerHTML = '';

      let lineIndex = 0;
      let charIndex = 0;
      let currentSpan = null;

      function type() {
        if (lineIndex >= lines.length) return;

        if (charIndex === 0) {
          currentSpan = document.createElement('span');
          if (colors[lineIndex]) currentSpan.style.color = colors[lineIndex];
          el.appendChild(currentSpan);
        }

        const line = lines[lineIndex];
        currentSpan.textContent += line[charIndex];
        charIndex++;

        if (charIndex < line.length) {
          setTimeout(type, 80);
        } else {
          if (lineIndex < lines.length - 1) {
            el.appendChild(document.createElement('br'));
          }
          lineIndex++;
          charIndex = 0;
          setTimeout(type, 200);
        }
      }

      type();
    });
</script>

  <div id="progress-bar"></div>

  <script>
  if (document.body.getAttribute('data-layout') === 'post') {
    window.addEventListener('scroll', function() {
      const bar = document.getElementById('progress-bar');
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = (scrollTop / docHeight) * 100;
      bar.style.width = progress + '%';
    });
  }
</script>

  <script>
    // Fade in on load
    document.body.style.opacity = '0';
    window.addEventListener('load', function() {
      document.body.style.transition = 'opacity 0.1s ease';
      document.body.style.opacity = '1';
    });

    // Fade out on navigation
    document.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('mailto') || this.target === '_blank') return;
        e.preventDefault();
        document.body.style.opacity = '0';
        setTimeout(function() {
          window.location.href = href;
        }, 100);
      });
    }); 
  </script>
</body>
</html>
